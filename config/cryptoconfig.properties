# Runtime Cryptographic Configuration for Oblivious Block Storage (OBSS)
# Changes take effect immediately on client startup without recompilation.
#
# Supported cipher modes:
#   - AES_256_GCM
#   - CHACHA20_POLY1305
#   - AES_256_CBC_HMAC_SHA256
cipher.mode=AES_256_GCM
key.size.bits=256
mac.algorithm=HmacSHA256
mac.key.size.bits=256
block.size.bytes=4096
